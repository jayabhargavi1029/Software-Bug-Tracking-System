spring.application.name=BugTrack
server.port=8080

# ---- Optional persistent MySQL connection; provide credentials through environment variables ----
# The database "bugtracker" is created automatically if it does not exist.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bugtracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates/updates the tables from the entity classes (see database/schema.sql for the same schema in SQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
server.error.include-message=never

# Demo accounts are only seeded by the isolated demo profile.
app.seed-demo-data=false
